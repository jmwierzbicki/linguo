name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The translator contract (CLAUDE.md §5.1): translator content is never
      # inserted as HTML. Fail the build if `innerHTML` appears in core source.
      - name: Guard against innerHTML in core
        run: |
          if grep -rn "innerHTML" packages/core/src; then
            echo "innerHTML is forbidden in packages/core/src (CLAUDE.md §5.1)"
            exit 1
          fi

      - name: Set Nx base/head SHAs for `affected`
        uses: nrwl/nx-set-shas@v4

      - run: pnpm exec nx affected -t lint test build
