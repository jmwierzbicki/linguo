name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The translator contract (CLAUDE.md §5.1): translator content is never
      # inserted as HTML. Fail the build if `innerHTML` appears in runtime source.
      - name: Guard against innerHTML in the runtime
        run: |
          if grep -rn "innerHTML" packages/linguo/src; then
            echo "innerHTML is forbidden in packages/linguo/src (CLAUDE.md §5.1)"
            exit 1
          fi

      - run: pnpm exec nx run-many -t lint test build
